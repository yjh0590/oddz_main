<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://api.anthropic.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="질문을 광장에 던지면 동서양 철학자들이 한 줄씩 답합니다.">
  <title>AGORA · 철학자들의 광장</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" type="module"></script>
</head>
<body>
  <canvas id="scene" class="scene" aria-hidden="true"></canvas>

  <div class="page">
    <header class="masthead">
      <p class="greek">AGORA</p>
      <h1>철학자들의 광장</h1>
    </header>

    <main>
      <section id="unlock" class="tablet" hidden aria-labelledby="unlock-title">
        <h2 id="unlock-title">광장 문 열기</h2>
        <form id="unlock-form">
          <label for="secret" id="secret-label">비밀번호</label>
          <input id="secret" type="password" autocomplete="current-password" required>
          <label class="remember"><input id="remember" type="checkbox" checked> 이 기기 기억하기</label>
          <button type="submit">문 열기</button>
          <p id="unlock-error" class="error" role="alert"></p>
        </form>
        <p class="fineprint" id="unlock-help"></p>
      </section>

      <section id="thread" class="thread" hidden>
        <h2 class="visually-hidden">광장의 대화</h2>
        <ol id="messages" class="messages" aria-live="polite"></ol>
      </section>

      <section id="ask" class="tablet" hidden aria-labelledby="ask-title">
        <h2 id="ask-title" class="visually-hidden">질문하기</h2>
        <form id="ask-form">
          <label for="question" class="visually-hidden">질문이나 의견</label>
          <input id="question" type="text" maxlength="400" required autocomplete="off" placeholder="무엇이든 물어보세요">
          <div class="ask-row">
            <button id="ask-button" type="submit">던지기</button>
          </div>
        </form>
      </section>

      <details id="history" class="history" hidden>
        <summary>지난 질문</summary>
        <ul id="history-list"></ul>
        <button type="button" id="clear-history" class="link">기록 지우기</button>
      </details>
    </main>

    <footer class="foot">
      <button type="button" id="lock" class="link" hidden>이 기기에서 잠그기</button>
      <details class="credits">
        <summary>AI가 사상을 바탕으로 지어낸 답입니다 · 초상 출처</summary>
        <ul id="credit-list"></ul>
      </details>
    </footer>
  </div>

</body>
</html>
