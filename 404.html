<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없어요 · oddz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23221934'/%3E%3Ccircle cx='50' cy='50' r='16' fill='%238fe3d0'/%3E%3Ccircle cx='50' cy='50' r='28' fill='%238fe3d0' opacity='0.25'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root { --bg:#221934; --bg2:#4c3966; --dusk:#c17c72; --paper:#f3ead9; --firefly:#8fe3d0; --muted:rgba(243,234,217,.72); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:grid; place-items:center; padding:24px 16px; overflow-x:hidden;
    background:
      radial-gradient(ellipse 70% 50% at 50% 38%,rgba(143,227,208,.12),transparent 60%),
      linear-gradient(170deg,var(--bg) 0%,var(--bg2) 60%,var(--dusk) 130%);
    color:var(--paper);
    font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif; text-align:center;
  }
  main { position:relative; max-width:520px; }
  .wordmark { display:inline-block; margin-bottom:44px; color:var(--paper); font-weight:800; font-style:italic; font-size:1.3rem; letter-spacing:-.02em; text-decoration:none; }
  .wordmark span { color:var(--firefly); }
  /* 가운데 0이 빛나는 병, 그 둘레를 반딧불이 세 마리가 돈다 */
  .code { display:flex; align-items:center; justify-content:center; gap:.08em; font-size:clamp(4.2rem,20vw,8.5rem); font-weight:800; line-height:1; letter-spacing:-.04em; }
  .code .jar { position:relative; display:inline-grid; place-items:center; width:.78em; height:.98em; border:.07em solid var(--firefly); border-radius:.36em; box-shadow:0 0 40px rgba(143,227,208,.35), inset 0 0 30px rgba(143,227,208,.18); }
  .code .jar::before { content:''; width:.16em; height:.16em; border-radius:50%; background:var(--firefly); box-shadow:0 0 18px 6px rgba(143,227,208,.55); animation:glow 2.6s ease-in-out infinite; }
  .fly { position:absolute; left:50%; top:50%; width:7px; height:7px; margin:-3.5px; border-radius:50%; background:var(--firefly); box-shadow:0 0 10px 3px rgba(201,242,230,.8); animation:orbit 7s linear infinite; }
  .fly:nth-of-type(2) { animation-duration:9s; animation-delay:-3s; --r:1.05em; }
  .fly:nth-of-type(3) { animation-duration:11s; animation-delay:-6s; animation-direction:reverse; --r:1.25em; }
  @keyframes orbit { from { transform:rotate(0) translateX(var(--r,.85em)) } to { transform:rotate(360deg) translateX(var(--r,.85em)) } }
  @keyframes glow { 50% { opacity:.35; transform:scale(.8) } }
  .eyebrow { display:inline-block; margin-top:34px; padding:5px 12px; border:1px dashed rgba(243,234,217,.4); border-radius:99px; font-size:.72rem; font-weight:700; letter-spacing:.08em; color:var(--firefly); }
  h1 { margin-top:16px; font-size:clamp(1.4rem,4vw,1.8rem); letter-spacing:-.02em; }
  p { margin-top:10px; color:var(--muted); line-height:1.7; }
  nav { margin-top:30px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  nav a { display:inline-flex; align-items:center; min-height:46px; color:var(--bg); background:var(--firefly); padding:10px 20px; border-radius:999px; text-decoration:none; font-weight:700; box-shadow:0 10px 28px -10px var(--firefly); transition:transform .2s; }
  nav a:hover { transform:translateY(-2px); }
  nav a.ghost { color:var(--paper); background:rgba(34,25,52,.35); border:1px solid rgba(243,234,217,.35); box-shadow:none; }
  nav a.ghost:hover { border-color:var(--firefly); }
  a:focus-visible { outline:3px solid var(--paper); outline-offset:3px; }
  @media (prefers-reduced-motion:reduce) { .fly, .code .jar::before { animation:none; } nav a { transition:none; } }
</style>
</head>
<body>
<main>
  <a class="wordmark" href="/">odd<span>z</span></a>
  <div class="code" aria-hidden="true">4<span class="jar"><span class="fly"></span><span class="fly"></span><span class="fly"></span></span>4</div>
  <span class="eyebrow">404 · NOT FOUND</span>
  <h1>페이지를 찾을 수 없어요</h1>
  <p>주소가 바뀌었거나 아직 올리지 않은 페이지예요.</p>
  <nav>
    <a href="/">홈으로</a>
    <a class="ghost" href="/#work">프로젝트 목록</a>
    <a class="ghost" href="/journal/index.html">개발일지</a>
  </nav>
</main>
</body>
</html>
