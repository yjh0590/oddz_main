<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">

<title>페이지를 찾을 수 없어요 · oddz</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root { --bg:#221934; --bg2:#4c3966; --paper:#f3ead9; --firefly:#8fe3d0; --muted:rgba(243,234,217,.7); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:grid; place-items:center; padding:24px 16px;
    background:linear-gradient(180deg,var(--bg),var(--bg2)); color:var(--paper);
    font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif; text-align:center;
  }
  .code { font-size:clamp(4rem,18vw,8rem); font-weight:800; color:var(--firefly); line-height:1; text-shadow:0 0 32px rgba(143,227,208,.45); }
  h1 { margin-top:16px; font-size:1.4rem; }
  p { margin-top:10px; color:var(--muted); line-height:1.7; }
  nav { margin-top:28px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  a { color:var(--bg); background:var(--firefly); padding:10px 18px; border-radius:999px; text-decoration:none; font-weight:700; }
  a.ghost { color:var(--paper); background:transparent; border:1px solid rgba(243,234,217,.4); }
  a:focus-visible { outline:3px solid var(--paper); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <div class="code" aria-hidden="true">404</div>
  <h1>페이지를 찾을 수 없어요</h1>
  <p>주소가 바뀌었거나 아직 올리지 않은 페이지예요.</p>
  <nav>
    <a href="/">홈으로</a>
    <a class="ghost" href="/#work">프로젝트 목록</a>
    <a class="ghost" href="/journal/index.html">개발일지</a>
  </nav>
</main>
</body>
</html>
